# Local dev stack: app + Langfuse v3 (web + worker + postgres + clickhouse + redis + minio).
# Bring up:    docker compose -f docker/docker-compose.yml --env-file .env up -d
# Tear down:   docker compose -f docker/docker-compose.yml down
# Wipe data:   docker compose -f docker/docker-compose.yml down -v

name: ai-job-assistant

# ─── Anchors: secrets shared across langfuse-web + langfuse-worker ──
x-langfuse-common: &langfuse-common
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/langfuse
  DIRECT_URL: postgresql://postgres:postgres@postgres:5432/langfuse
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: redis
  # Quoted to keep YAML from parsing all-digits as a number.
  SALT: "dev-salt-change-me-please"
  ENCRYPTION_KEY: "aaaabbbbccccddddeeeeffff0000111122223333444455556666777788889999"
  TELEMETRY_ENABLED: "false"
  # ─── S3 / blob storage (required in v3) ─────────────────────────
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  # ─── Our app ────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ai-job-assistant:dev
    container_name: aja-app
    env_file: ../.env
    environment:
      # Override Langfuse host so we talk to the container, not localhost.
      LANGFUSE_HOST: http://langfuse-web:3000
      # Make sure `app` package and `scripts/` are importable from anywhere.
      PYTHONPATH: /workspace
    ports:
      - "8000:8000"
    volumes:
      - ../app:/workspace/app                  # hot-reload friendly
      - ../streamlit_app:/workspace/streamlit_app
      - ../prompts:/workspace/prompts
      - ../scripts:/workspace/scripts
      - ../tests:/workspace/tests
      - ../evals:/workspace/evals
      - ../data:/workspace/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      langfuse-web:
        condition: service_started

  # ─── Langfuse web (UI + API) ────────────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: aja-langfuse-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-common
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: "dev-nextauth-secret-change-me"
      LANGFUSE_INIT_ORG_ID: aja
      LANGFUSE_INIT_ORG_NAME: ai-job-assistant
      LANGFUSE_INIT_PROJECT_ID: aja-dev
      LANGFUSE_INIT_PROJECT_NAME: ai-job-assistant-dev
      LANGFUSE_INIT_USER_EMAIL: dev@example.com
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: "dev-password-change-me"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/public/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ─── Langfuse worker (background processor for traces/events) ───
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: aja-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *langfuse-common

  # ─── Postgres (Langfuse metadata) ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── ClickHouse (Langfuse trace store) ──────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: aja-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis (Langfuse queue) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aja-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── MinIO (S3-compatible blob store for Langfuse event uploads) ─
  minio:
    image: minio/minio:latest
    container_name: aja-minio
    restart: unless-stopped
    ports:
      - "9090:9000"   # S3 API on host:9090 to avoid clashing with clickhouse:9000
      - "9091:9001"   # MinIO console
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── One-shot job: create the langfuse bucket inside MinIO ──────
  minio-init:
    image: minio/mc:latest
    container_name: aja-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minio miniosecret &&
        mc mb --ignore-existing local/langfuse &&
        echo "Bucket 'langfuse' ready."
    restart: "no"

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
